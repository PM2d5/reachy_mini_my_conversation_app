<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>My Conversation App – Settings</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <div class="ambient"></div>
    <div id="loading" class="loading">
      <div class="spinner"></div>
      <p>Loading…</p>
    </div>
    <div class="container">
      <header class="hero">
        <div class="pill">Headless control</div>
        <h1>My Conversation App</h1>
        <p class="subtitle">Conversation backend status for the Reachy Mini app.</p>
      </header>

      <div id="configured" class="panel hidden">
        <div class="panel-heading">
          <div>
            <p class="eyebrow">Backend</p>
            <h2>Ready</h2>
          </div>
          <span id="backend-chip" class="chip chip-ok">Connected</span>
        </div>
        <p id="backend-summary" class="muted"></p>
      </div>

      <div id="form-panel" class="panel hidden">
        <div class="panel-heading">
          <div>
            <p class="eyebrow">Backend</p>
            <h2>Not configured</h2>
          </div>
          <span class="chip">Required</span>
        </div>
        <p id="backend-guidance" class="muted"></p>
      </div>
    </div>

    <script src="/static/main.js"></script>
  </body>
</html>
